name: CI

on:
  push:
    branches: [master, main, "release/**"]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer_pass
          POSTGRES_DB: trainer_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Debug test environment
        run: |
          python --version
          python -c "import bcrypt; print('bcrypt version:', bcrypt.__version__)"
          python -c "from passlib.hash import bcrypt as bcrypt_hash; print('passlib bcrypt backend:', bcrypt_hash.get_backend())"
          which psql && psql --version || echo "psql not found (will install)"

      - name: Wait for PostgreSQL readiness
        env:
          MIGRATION_DATABASE_URL: postgresql://trainer:trainer_pass@localhost:5432/trainer_platform
        run: |
          python << 'PYEOF'
          import os, time, psycopg2
          url = os.environ["MIGRATION_DATABASE_URL"]
          for i in range(30):
              try:
                  conn = psycopg2.connect(url)
                  cur = conn.cursor()
                  cur.execute("SELECT 1")
                  row = cur.fetchone()
                  cur.close()
                  conn.close()
                  assert row and row[0] == 1
                  print(f"PostgreSQL ready (SELECT 1 = {row[0]})")
                  break
              except Exception as e:
                  if i == 29:
                      raise RuntimeError(f"PostgreSQL not ready after 30 attempts: {e}")
                  print(f"Waiting for PostgreSQL (attempt {i+1}/30)...")
                  time.sleep(2)
          PYEOF

      - name: Apply Alembic migrations (prepare PostgreSQL for migration tests)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://trainer:trainer_pass@localhost:5432/trainer_platform
          APP_ENV: testing

      - name: Run migration tests
        run: python -m pytest tests/certification_core/test_migration_005_execution.py tests/certification_core/test_migration_006_execution.py -v --tb=long --timeout=120
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
          MIGRATION_DATABASE_URL: postgresql://trainer:trainer_pass@localhost:5432/trainer_platform
          POSTGRES_MIGRATION_URL: postgresql://trainer:trainer_pass@localhost:5432/trainer_platform
          SECRET_KEY: ci-secret-key-not-for-production
          APP_ENV: testing
          DEBUG: "false"

      - name: Run remaining tests — certification core (SQLite)
        run: python -m pytest tests/certification_core/ --ignore=tests/certification_core/test_migration_005_execution.py --ignore=tests/certification_core/test_migration_006_execution.py -v --tb=long --timeout=120
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
          SECRET_KEY: ci-secret-key-not-for-production
          APP_ENV: testing
          DEBUG: "false"

      - name: Run remaining tests — general (SQLite)
        run: python -m pytest tests/ -v --tb=long --timeout=120 --ignore=tests/certification_core/ --ignore=tests/e2e/
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
          SECRET_KEY: ci-secret-key-not-for-production
          APP_ENV: testing
          DEBUG: "false"

      - name: Run E2E smoke (SQLite)
        run: python -m pytest tests/e2e/test_smoke.py -v --tb=long --timeout=120
        env:
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
          SECRET_KEY: ci-secret-key-not-for-production
          APP_ENV: testing
          DEBUG: "false"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test_ci.db
          retention-days: 7

  trainer-package-validation:
    name: Trainer Package Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Validate trainer package
        run: python scripts/validate_trainer_package.py ../trainer_packages/qa_engineer_interview_trainer

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer_pass
          POSTGRES_DB: trainer_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Alembic migrations
        run: |
          cp ../.env.example .env
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://trainer:trainer_pass@localhost:5432/trainer_platform
          DATABASE_SYNC_URL: postgresql://trainer:trainer_pass@localhost:5432/trainer_platform
          APP_ENV: testing

      - name: Verify migration rollback
        run: alembic downgrade -1

      - name: Re-apply migration
        run: alembic upgrade head

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose

  openapi-export:
    name: OpenAPI Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///test_openapi.db
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "false"
