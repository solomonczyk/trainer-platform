name: Deploy Staging (VPS)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types:
      - completed

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy (default: latest master)"
        required: false
        type: string

env:
  VPS_HOST: "152.53.227.37"
  VPS_USER: "trainer"
  VPS_PORT: 22
  VPS_DEPLOY_PATH: "/opt/trainer-platform"

jobs:
  deploy:
    name: Deploy to VPS Staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Record deployed commit
        run: |
          echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "DEPLOYED_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.VPS_DEPLOY_PATH }}/repo
            git fetch origin
            git checkout ${{ inputs.commit || github.sha }}
            echo "Checked out $(git rev-parse HEAD)"

            cd ${{ env.VPS_DEPLOY_PATH }}/deploy

            # Record previous commit for rollback
            echo "$(cat /tmp/current_deployed_commit 2>/dev/null || echo 'none')" > /tmp/previous_deployed_commit

            # Build images
            docker compose -f docker-compose.staging.yml build backend frontend 2>&1

            # Run migrations
            docker run --rm --network deploy_internal \
              --env-file ${{ env.VPS_DEPLOY_PATH }}/env/backend.env \
              deploy-backend:latest alembic upgrade head 2>&1

            # Restart services
            docker compose -f docker-compose.staging.yml up -d backend frontend caddy 2>&1

            # Record new commit
            echo "$(git rev-parse HEAD)" > /tmp/current_deployed_commit

      - name: Health Check
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://trainer.152.53.227.37.nip.io/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check returned $STATUS, retrying in 10s (attempt $i/5)..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment status: $STATUS"
          echo "Deployed commit: ${{ env.DEPLOYED_COMMIT }}"
