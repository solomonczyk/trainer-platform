name: Deploy Staging (VPS)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types:
      - completed

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy (default: latest master)"
        required: false
        type: string

env:
  VPS_HOST: "152.53.227.37"
  VPS_USER: "trainer"
  VPS_PORT: 22
  VPS_DEPLOY_PATH: "/opt/trainer-platform"

jobs:
  deploy:
    name: Deploy to VPS Staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Record deployed commit
        run: |
          echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "DEPLOYED_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "Target commit: $(git rev-parse HEAD)"

      - name: Validate deployment secrets
        run: |
          ERRORS=0
          if [ -z "$VPS_HOST" ]; then echo "::error::VPS_HOST is not configured"; ERRORS=$((ERRORS+1)); fi
          if [ -z "$VPS_USER" ]; then echo "::error::VPS_USER is not configured"; ERRORS=$((ERRORS+1)); fi
          if [ -z "$VPS_SSH_KEY" ]; then echo "::error::VPS_SSH_KEY is not configured"; ERRORS=$((ERRORS+1)); fi
          if [ -z "$VPS_DEPLOY_PATH" ]; then echo "::error::VPS_DEPLOY_PATH is not configured"; ERRORS=$((ERRORS+1)); fi
          if [ "$ERRORS" -ne 0 ]; then echo "::error::$ERRORS deployment configuration value(s) missing — aborting"; exit 1; fi
          echo "All deployment secrets validated"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e

            # 1. Ensure persistent deploy directory exists
            mkdir -p ${{ env.VPS_DEPLOY_PATH }}/deploy

            # 2. Write pending_commit atomically BEFORE deploy
            #    This marks the target being deployed so rollback knows what's happening
            PENDING_SHA="${{ env.DEPLOYED_COMMIT }}"
            pending_tmp="$(mktemp)"
            printf '%s\n' "$PENDING_SHA" > "$pending_tmp"
            mv "$pending_tmp" ${{ env.VPS_DEPLOY_PATH }}/deploy/pending_commit
            echo "Pending commit set to $PENDING_SHA"

            # 3. Checkout the exact target commit
            cd ${{ env.VPS_DEPLOY_PATH }}/repo
            git fetch origin
            git checkout "$PENDING_SHA"
            DEPLOYED_SHA=$(git rev-parse HEAD)
            if [ "$DEPLOYED_SHA" != "$PENDING_SHA" ]; then
              echo "ERROR: Checkout mismatch — expected $PENDING_SHA, got $DEPLOYED_SHA"
              exit 1
            fi
            echo "Checked out $DEPLOYED_SHA"

            # 4. Build images
            cd ${{ env.VPS_DEPLOY_PATH }}/deploy
            docker compose -f docker-compose.staging.yml build backend frontend 2>&1
            echo "Images built successfully"

            # 5. Run migrations
            docker run --rm --network deploy_internal \
              --env-file ${{ env.VPS_DEPLOY_PATH }}/env/backend.env \
              deploy-backend:latest alembic upgrade head 2>&1
            echo "Migrations applied"

            # 6. Restart services
            docker compose -f docker-compose.staging.yml up -d backend frontend caddy 2>&1
            echo "Services restarted"

      - name: Health Check
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://trainer.152.53.227.37.nip.io/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check returned $STATUS, retrying in 10s (attempt $i/5)..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Confirm deployment (rotate commits on success)
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e

            # Only rotate if health check passed (guaranteed by step-level if: success())
            PENDING=$(cat ${{ env.VPS_DEPLOY_PATH }}/deploy/pending_commit 2>/dev/null || echo "")
            CURRENT=$(cat ${{ env.VPS_DEPLOY_PATH }}/deploy/current_commit 2>/dev/null || echo "")

            if [ -z "$PENDING" ]; then
              echo "ERROR: No pending_commit found — nothing to confirm"
              exit 1
            fi

            # Atomic rotate: previous ← current, current ← pending
            if [ -n "$CURRENT" ]; then
              prev_tmp="$(mktemp)"
              printf '%s\n' "$CURRENT" > "$prev_tmp"
              mv "$prev_tmp" ${{ env.VPS_DEPLOY_PATH }}/deploy/previous_commit
              echo "Rotated previous_commit → $CURRENT"
            fi

            curr_tmp="$(mktemp)"
            printf '%s\n' "$PENDING" > "$curr_tmp"
            mv "$curr_tmp" ${{ env.VPS_DEPLOY_PATH }}/deploy/current_commit
            echo "Rotated current_commit → $PENDING"

            # Remove pending — deployment is fully committed
            rm -f ${{ env.VPS_DEPLOY_PATH }}/deploy/pending_commit

            echo "=== Commit rotation complete ==="
            echo "  current=$(cat ${{ env.VPS_DEPLOY_PATH }}/deploy/current_commit)"
            echo "  previous=$(cat ${{ env.VPS_DEPLOY_PATH }}/deploy/previous_commit)"

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment status: $STATUS"
          echo "Deployed commit: ${{ env.DEPLOYED_COMMIT }}"
