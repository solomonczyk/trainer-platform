version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trainer_platform_db
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer_pass
      POSTGRES_DB: trainer_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
